[project]
name = "vol-accum-dashboard"
version = "0.1.0"
description = "Real-time crypto volume anomaly detector across multiple exchanges"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
    "aiofiles>=23.2.1",
    "python-dateutil>=2.8.2",
]

[project.scripts]
bootstrap = "vol_accum_dashboard.bootstrap:main"
monitor = "vol_accum_dashboard.monitor:main"
server = "vol_accum_dashboard.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
